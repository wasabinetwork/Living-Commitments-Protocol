[package]
name = "lcp-bounded-payout-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository = "https://github.com/wasabinetwork/Living-Commitments-Protocol"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.100.0"
image_digest = "sha256:265b662a03642196c8a1b97cb8e1bff9156488b584a9e040e9ef1f264e1049f1"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
