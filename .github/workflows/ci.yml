name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust contracts and evaluators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain and WASM targets
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown --target wasm32-wasip1 --target wasm32-wasip2
      - name: Install pinned cargo-near CLI
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/cargo-near-installer.sh \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh
          echo '76ae71bc6a99864a09cc67c1c0bf82a2b7812d8ab4c93034b680235df6d22028  /tmp/cargo-near-installer.sh' | sha256sum --check
          sh /tmp/cargo-near-installer.sh
          cargo near --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Check NEAR contracts with on-chain configuration
        run: |
          cargo near check --locked --manifest-path contracts/lcp-core/Cargo.toml
          cargo near check --locked --manifest-path contracts/bounded-payout-adapter/Cargo.toml
      - name: Build evaluator WASM
        run: |
          cargo build -p maintenance-heartbeat --target wasm32-wasip1 --release --locked
          cargo build -p service-availability-evaluator --target wasm32-wasip2 --release --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  javascript:
    name: Console, SDK, and Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run JavaScript tests
        run: npm test
      - name: Check Event Indexer Worker
        run: npm run check --workspace=@lcp/event-indexer
      - name: Check Reviewer Access Worker
        run: npm run check --workspace=@lcp/reviewer-access
      - name: Build Console
        run: npm run build

  captures:
    name: Sandbox capture evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The harness package requires >= 26 and the pinned runner is
          # node:26-trixie-slim. These checks use only Node builtins.
          node-version: 26
      # The historical protocol-88, bootstrap-guard, and native-excess-refund
      # verifiers pin contract sources from earlier revisions, so they are run at
      # their pinned source revision (see the capture README), not at HEAD.
      # verify-release-feature-exclusion.mjs regenerates a committed capture, so
      # it is not a HEAD gate either.
      - name: Verify committed captures
        run: |
          node tests/sandbox-usdc-callbacks/verify-rotation-live-intent-capture.mjs
          node tests/sandbox-usdc-callbacks/verify-rotation-live-intent-capture.mjs \
            --fresh tests/sandbox-usdc-callbacks/rotation-live-intent-acceptance-2026-11-19/reproduction-recovery.json
          node tests/sandbox-usdc-callbacks/verify-storage-registry-capture.mjs
      - name: Run capture verifier mutation checks
        run: node --test tests/sandbox-usdc-callbacks/test/*.test.mjs
