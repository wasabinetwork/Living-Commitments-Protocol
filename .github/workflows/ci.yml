name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust contracts and evaluators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain and WASM targets
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown --target wasm32-wasip2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Build NEAR contracts
        run: cargo build -p lcp-core -p lcp-bounded-payout-adapter --target wasm32-unknown-unknown --release --locked
      - name: Build evaluator WASM
        run: cargo build -p maintenance-heartbeat -p service-availability-evaluator --target wasm32-wasip2 --release --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  javascript:
    name: Console, SDK, and Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Run JavaScript tests
        run: npm test
      - name: Check Event Indexer Worker
        run: npm run check --workspace=@lcp/event-indexer
      - name: Check Reviewer Access Worker
        run: npm run check --workspace=@lcp/reviewer-access
      - name: Build Console
        run: npm run build
