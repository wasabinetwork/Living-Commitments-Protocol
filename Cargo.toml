[workspace]
members = ["contracts/lcp-core", "contracts/bounded-payout-adapter", "evaluators/maintenance-heartbeat", "evaluators/service-availability"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.94"

[workspace.dependencies]
base64 = "=0.23.1"
near-sdk = { version = "=5.29.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "=0.5.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.1"
